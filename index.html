<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />

    <link rel="stylesheet" href="./css/components/header.css">
    <link rel="stylesheet" href="./css/components/hero.css">
    <link rel="stylesheet" href="./css/components/product-categories.css">
    <link rel="stylesheet" href="./css/components/product-grid.css">
    <title>Syntaxwear - Tênis e Sneakers Online</title>
    <meta name="description" content="Compre os melhores tênis e sneakers online na SyantaxWear. Encontre modelos exclusivos, ofertas imperdíveis e frete grátis para todo o Brasil">
  </head>
  <body>
    <header class="header">
      <h1 class="logo">
        <a href="/" title="Syntaxwear - Tênis e Sneakers Online">
          <img src="./images/logo/logo.svg" alt="Syntaxwear - Tênis e Sneakers Online">
        </a>
      </h1>

      <nav class="nav-center" aria-label="Categorias Principais">
        <ul>
          <li><a href="#">Masculino</a></li>
          <li><a href="#">Femnino</a></li>
          <li><a href="#">Outlet</a></li>
        </ul>
      </nav>

      <nav class="nav-right" aria-label="Acesso rápido">
        <ul>
          <li><a href="#">Nossas Lojas</a></li>
          <li><a href="#">Sobre</a></li>
          <li><a href="#" aria-label="Minha conta">
            <img src="./images/icons/user.svg" alt="Minha conta">
          </a></li>
          <li><a href="#" aria-label="Ajuda">
            <img src="images/icons/help.svg" alt="Ajuda">
          </a></li>
          <li><a href="#" aria-label="Carrinho">
            <img src="./images/icons/bag.svg" alt="Carrinho">
          </a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="hero-overlay">
          <div class="hero-content">
            <span class="hero-subtitle">Krypton One</span>
            <h2 class="hero-title">Transforme qualquer passo em presença.</h2>
            <div class="hero-buttons">
              <a class="btn btn-outline" href="#">Ver modelos</a>
              <a class="btn btn-filled" href="#">Comprar</a>
          </div>
          </div>
        </div>
      </section>

      <section class="categories">
          <div class="card-categories casual">
            <a href="#" class="categories-link">
              <span class="categories-overlay"></span>
              <span class="categories-name btn btn-outline">Casual</span>
            </a>
          </div>
          <div class="card-categories esporte">
            <a href="#" class="categories-link">
              <span class="categories-overlay"></span>
              <span class="categories-name btn btn-outline">Esporte</span>
            </a>
          </div>
          <div class="card-categories moderno">
            <a href="#" class="categories-link">
              <span class="categories-overlay"></span>
              <span class="categories-name btn btn-outline">Moderno</span>
            </a>
          </div>
          <div class="card-categories futurista">
            <a href="#" class="categories-link">
              <span class="categories-overlay"></span>
              <span class="categories-name btn btn-outline">Futurista</span>
            </a>
          </div>
        </div>
      </section>

      <section class="products-section">
        <div class="card top1">
          <div class="top1-content">
            <h3 class="card-title">Krypto One</h3>
            <p class="card-subtitle">Estilo urbano com atitude</p>
            <div class="cta-group">
              <a href="" class="btn btn-outline">Feminino</a>
              <a href="" class="btn btn-outline">Masculino</a>
            </div>
          </div>
        </div>
        <div class="card top2"></div>
        <div class="card midL"></div>
        <div class="card midR"></div>
        <div class="card buttomL"></div>
        <div class="card buttomR"></div>

      </section>
    </main>

    <footer class="site-footer">

    </footer>
  </body>
</html>
